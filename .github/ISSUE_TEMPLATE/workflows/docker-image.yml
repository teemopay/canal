# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "teemopay/1.1.8" ]
  pull_request:
    branches: [ "teemopay/1.1.8" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [8]
      fail-fast: false
      max-parallel: 16
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven if test jdk8
        if: ${{ matrix.java == '8' || matrix.java == '11'}}
        run: ./mvnw -Pgen-javadoc clean package -B -DskipTests
        
      - name: Package the Canal-Server directory
        run: tar -czvf canal.deployer-1.1.8.tar.gz -C ./deployer/target/canal .  && mv canal.deployer-1.1.8.tar.gz ./docker/
        working-directory: .
      - name: Package the Canal-Admin directory
        run: tar -czvf canal.admin-1.1.8.tar.gz -C ./admin/admin-web/target/canal-admin . && mv canal.admin-1.1.8.tar.gz ./docker/
        working-directory: .

      - name: Set timestamp variable
        run: echo "TIMESTAMP=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Canal-Server Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/canal-server:latest
            ${{ secrets.DOCKERHUB_USER }}/canal-server:${{ env.TIMESTAMP }}
            
      - name: Canal-Admin Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/
          file: ./docker/Dockerfile_admin
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/canal-admin:latest
            ${{ secrets.DOCKERHUB_USER }}/canal-admin:${{ env.TIMESTAMP }}
